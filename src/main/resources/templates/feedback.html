<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareSync - Feedback Moderation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .bg-mesh { background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(217,100%,96%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(228,100%,97%,1) 0, transparent 50%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-slate-900 border-r border-slate-800 hidden md:flex flex-col z-30 shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.1)]">
    <div class="h-24 flex items-center px-6 border-b border-slate-800/50">
        <div class="flex items-center gap-3"><div class="bg-blue-500 p-2.5 rounded-xl text-white shadow-lg"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg></div><h1 class="text-2xl font-extrabold text-white tracking-wide">Care<span class="text-blue-400">Sync</span></h1></div>
    </div>
    <nav class="flex-1 overflow-y-auto py-8 px-4 space-y-2">
        <p class="px-4 text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Menu</p>
        <a href="patient.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Patients</a>
        <a href="doctor.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Doctors</a>
        <a href="department.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Departments</a>
        <a href="appointment.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Appointments</a>
        <a href="prescription.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Prescriptions</a>
        <a href="payment.html" class="flex items-center gap-3 px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-medium transition-colors">Billing & Payments</a>
        <a href="feedback.html" class="flex items-center gap-3 px-4 py-3.5 bg-blue-600 text-white rounded-2xl font-semibold shadow-md shadow-blue-900/20">Feedback</a>
    </nav>
    <div class="p-4 border-t border-slate-800/50"><button onclick="logout()" class="flex items-center gap-3 w-full px-4 py-3.5 text-slate-400 hover:bg-slate-800 hover:text-rose-400 rounded-2xl font-medium transition-colors">Log out</button></div>
</aside>

<main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-mesh">
    <header class="relative z-10 h-24 flex items-center justify-between px-8 shrink-0 bg-white/40 backdrop-blur-xl border-b border-white/60 shadow-sm">
        <div><h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Feedback Moderation</h2></div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 md:p-8 relative z-10">
        <div class="max-w-[1200px] mx-auto">

            <!-- SUMMARY STATS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white flex flex-col justify-center items-center">
                    <p class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-1">Total Reviews</p>
                    <h3 class="text-4xl font-extrabold text-blue-600" id="totalReviews">0</h3>
                </div>
                <div class="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white flex flex-col justify-center items-center">
                    <p class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-1">Average Rating</p>
                    <h3 class="text-4xl font-extrabold text-amber-500" id="avgRating">0.0 <span class="text-2xl">⭐</span></h3>
                </div>
                <div class="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white flex flex-col justify-center items-center">
                    <p class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-1">Pending Review</p>
                    <h3 class="text-4xl font-extrabold text-rose-500" id="pendingReviews">0</h3>
                </div>
            </div>

            <!-- FEEDBACK GRID -->
            <div id="feedbackGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Cards will render here -->
                <div class="col-span-full text-center py-20 text-slate-400 font-medium">No feedback recorded yet.</div>
            </div>

        </div>
    </div>
</main>

<script>
    const FEEDBACK_API = "http://localhost:8080/feedback";

    // Helper to generate star visuals
    function getStars(rating) {
        let stars = "";
        for(let i = 1; i <= 5; i++) {
            if(i <= rating) stars += '<span class="text-amber-400 text-lg">★</span>';
            else stars += '<span class="text-slate-200 text-lg">★</span>';
        }
        return stars;
    }

    async function loadFeedback() {
        try {
            const res = await fetch(FEEDBACK_API);
            const data = await res.json();

            // Update Stats
            document.getElementById('totalReviews').innerText = data.length;
            const pending = data.filter(f => f.status === 'New').length;
            document.getElementById('pendingReviews').innerText = pending;

            if(data.length > 0) {
                const avg = data.reduce((sum, f) => sum + f.rating, 0) / data.length;
                document.getElementById('avgRating').innerHTML = `${avg.toFixed(1)} <span class="text-2xl">⭐</span>`;
            } else {
                document.getElementById('avgRating').innerHTML = `0.0 <span class="text-2xl">⭐</span>`;
            }

            // Render Grid
            const container = document.getElementById('feedbackGrid');
            if(data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-medium">No feedback recorded yet.</div>`;
                return;
            }

            let html = "";
            // Show newest first
            data.reverse().forEach(f => {
                const isNew = f.status === 'New';
                const badgeClass = isNew ? "bg-rose-100 text-rose-700" : "bg-emerald-100 text-emerald-700";

                html += `
                <div class="bg-white/80 backdrop-blur-xl p-6 rounded-[2rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] border ${isNew ? 'border-rose-100' : 'border-white'} relative flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-extrabold text-slate-800">${f.patientName}</h3>
                            <p class="text-xs font-bold text-blue-600 mt-1">Review for: ${f.doctorName}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">${f.submissionDate}</p>
                        </div>
                        <span class="${badgeClass} px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest">${f.status}</span>
                    </div>

                    <div class="mb-4">${getStars(f.rating)}</div>
                    <p class="text-sm text-slate-600 leading-relaxed italic flex-1">"${f.comments}"</p>

                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end gap-3">
                        ${isNew ? `<button onclick="markReviewed(${f.id})" class="text-xs font-bold bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-4 py-2 rounded-xl transition-colors">Mark Reviewed</button>` : ''}
                        <button onclick="deleteFeedback(${f.id})" class="text-xs font-bold bg-slate-50 text-slate-400 hover:text-red-500 hover:bg-red-50 px-4 py-2 rounded-xl transition-colors">Delete</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;

        } catch (err) { console.error("Failed to load feedback"); }
    }

    // --- ADMIN MODERATION CONTROLS ---
    function markReviewed(id) {
        fetch(`${FEEDBACK_API}/${id}/status?status=Reviewed`, { method: "PUT" }).then(() => loadFeedback());
    }

    function deleteFeedback(id) {
        if(confirm("Are you sure you want to permanently delete this review?")) {
            fetch(`${FEEDBACK_API}/${id}`, { method: "DELETE" }).then(() => loadFeedback());
        }
    }

    function logout() { if (confirm("Log out?")) { localStorage.removeItem('currentUser'); window.location.href = 'auth.html'; } }

    // Start
    loadFeedback();
</script>
</body>
</html>
